name: Build Lavender Kernel (KernelSU-Next + SUSFS)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source (owner/repo)"
        default: "lavenderOSS/kernel_xiaomi_sdm660-4.19"
      kernel_branch:
        description: "Kernel branch"
        default: "main"
      defconfig:
        description: "Defconfig"
        default: "lavender_defconfig"
      enable_ksu:
        description: "Add KernelSU-Next (turn OFF to test that the base kernel boots)"
        type: boolean
        default: true
      ksu_branch:
        description: "KernelSU-Next branch (legacy = old kernels like 4.19)"
        default: "legacy"
      enable_susfs:
        description: "Try to apply SUSFS patch (leave off for the first build)"
        type: boolean
        default: false
      susfs_branch:
        description: "susfs4ksu branch (GitLab)"
        default: "kernel-4.19"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            cpio zip curl git python3 ccache lz4 xz-utils

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            "https://github.com/${{ inputs.kernel_repo }}" kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile | head -3

      - name: Clone clang toolchain
        run: git clone --depth 1 https://github.com/kdrag0n/proton-clang clang

      - name: Add KernelSU-Next
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksu_branch }}/kernel/setup.sh" \
            | bash -s "${{ inputs.ksu_branch }}"
          echo "KernelSU dir:"; ls -la drivers/kernelsu || true

      - name: Patch KernelSU-Next for 4.19 (no tracepoint prio API)
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          sed -i 's/register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)/register_trace_sys_enter(ksu_sys_enter_handler, NULL)/' \
            drivers/kernelsu/hook/hook_manager.c
          grep -n 'register_trace' drivers/kernelsu/hook/hook_manager.c

      - name: Add pgtable.h shim (4.19 has no linux/pgtable.h)
        working-directory: kernel
        run: |
          if [ ! -f include/linux/pgtable.h ]; then
            printf '#ifndef _LINUX_PGTABLE_H\n#define _LINUX_PGTABLE_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
          fi
          ls -l include/linux/pgtable.h

      - name: Try SUSFS patch
        id: susfs
        if: ${{ inputs.enable_susfs }}
        working-directory: kernel
        continue-on-error: true
        run: |
          git clone --depth 1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs
          grep -rn 'SUSFS_VERSION' ../susfs/kernel_patches/include/linux/susfs.h || true
          cp -v ../susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -v ../susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          PATCH=$(ls ../susfs/kernel_patches/50_add_susfs_in_kernel-*.patch | head -1)
          echo "Using $PATCH"
          patch -p1 --dry-run < "$PATCH"      # fails the step if it does not fit
          patch -p1 < "$PATCH"
          echo "applied=1" >> "$GITHUB_OUTPUT"

      - name: Strip Polly flags
        working-directory: kernel
        run: |
          grep -rl "polly" --include='Makefile*' --include='*.mk' . | xargs -r sed -i -E 's/-mllvm[[:space:]]+-polly[^[:space:]]*//g'
          grep -rn "polly" --include='Makefile*' . || echo "polly removed"

      - name: Configure and build
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          ARGS="O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make $ARGS "${{ inputs.defconfig }}"

          # KernelSU-Next on a non-GKI 4.19 kernel: syscall table hook mode
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            scripts/config --file out/.config \
              -e KSU -d KSU_MANUAL_HOOK -e KSU_SYSCALL_TABLE_HOOK \
              -e OVERLAY_FS
          fi
          if [ "${{ steps.susfs.outputs.applied }}" = "1" ]; then
            scripts/config --file out/.config \
              -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG
          else
            echo "::warning::SUSFS was NOT applied - building KernelSU only"
          fi
          make $ARGS olddefconfig
          grep -E "CONFIG_KSU" out/.config || true
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            grep -q "^CONFIG_KSU_SYSCALL_TABLE_HOOK=y" out/.config || { echo "::error::KSU hook mode not enabled"; exit 1; }
          fi
          make $ARGS -j"$(nproc)" > build.log 2>&1 || {
            echo "=== BUILD FAILED - error lines ==="
            grep -n -E "error:|Error [0-9]|\*\*\*|undefined reference|fatal" build.log | head -60
            echo "=== last 30 lines ==="
            tail -n 30 build.log
            exit 1
          }

      - name: Collect Image.gz-dtb
        working-directory: kernel
        run: |
          B=out/arch/arm64/boot
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -f "$B/Image.gz-dtb" ]; then
            cp "$B/Image.gz-dtb" "$GITHUB_WORKSPACE/out/Image.gz-dtb"
          else
            cat "$B/Image.gz" $(find "$B/dts" -name '*lavender*.dtb' -o -name '*sdm660*.dtb' | sort) \
              > "$GITHUB_WORKSPACE/out/Image.gz-dtb"
          fi
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Pack AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          cp "$GITHUB_WORKSPACE/out/Image.gz-dtb" .
          cat > anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Lavender custom kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lavender
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then NAME=lavender-ksu-kernel; else NAME=lavender-base-kernel; fi
          zip -r9 "$GITHUB_WORKSPACE/out/$NAME.zip" . -x '.git*' '*.md'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavender-kernel
          path: |
            out/Image.gz-dtb
            out/*.zip
            kernel/build.log
            
